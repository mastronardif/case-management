# Inside the casemanagement "web" container. OpenHost's Nginx handles HTTPS and forwards here.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Document uploads.
    client_max_body_size 50m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # The UI calls these at the site root, so the site gets its own port instead of a sub-path.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_read_timeout 300s;
    }
    location /s/ {
        set $api http://api:8080;
        proxy_pass $api;
    }
    location /swagger {
        set $api http://api:8080;
        proxy_pass $api;
    }

    # React Router: unknown paths load the app, which then shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
