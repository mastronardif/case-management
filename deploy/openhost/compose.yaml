# Case Management on OpenHost (HPEliteBook01), MOCK DATA ONLY.
# Images are built on the Windows PC by build_and_ship.py and loaded on the HP,
# so no source code or local files reach the server. db/ holds the mock schema and seed.
name: casemanagement

services:
  # SQL Server 2022 Developer edition: free, not licensed for real production use.
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      # For SSMS from the Windows PC (home network only; no router ports are forwarded).
      # IPv4 only, like OpenHost's Nginx. Before going public: remove this and use an SSH tunnel.
      - "0.0.0.0:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 3g
    cpus: 2

  # One-shot: creates the CaseManagement database from db/ on first run, and keeps
  # the app login's password in sync with .env. Does nothing else on later runs.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./db:/init:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    image: casemanagement-api:mock
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=CaseManagement;User Id=cmapp;Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      # Serilog sinks from appsettings.json: [1] is the file sink, [2] is the SQL sink.
      Serilog__WriteTo__1__Args__path: /app/logs/log-.txt
      Serilog__WriteTo__2__Args__connectionString: "Server=db;Database=CaseManagement;User Id=cmapp;Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
    depends_on:
      db-init:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: 1

  # Serves the built React UI and passes /api, /s/ and /swagger to the API.
  web:
    image: casemanagement-web:mock
    restart: unless-stopped
    networks:
      default:
      web:
        aliases:
          - casemanagement-web
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.5

networks:
  default:
  # Shared with OpenHost's Nginx only. OpenHost's compose.yaml creates it, so start that stack first.
  web:
    name: casemanagement-web
    external: true

volumes:
  mssql-data:
